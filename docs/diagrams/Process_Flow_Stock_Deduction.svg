<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <style>
      .flow-title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; fill: #4A2810; font-size: 20px; }
      .box-txt { font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; fill: #ffffff; font-size: 13px; text-anchor: middle; }
      .box-sub { font-family: 'Segoe UI', Arial, sans-serif; fill: #ffffff; font-size: 11px; text-anchor: middle; opacity: 0.9; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#F8FAFC"/>

  <text x="50" y="40" class="flow-title">QUY TRÌNH BÁN HÀNG &amp; THỰC THI TRIGGER TỰ ĐỘNG TRỪ TỒN KHO</text>

  <!-- Step 1: Thu ngân chọn món -->
  <g transform="translate(50, 80)">
    <rect width="240" height="70" rx="8" fill="#B45309"/>
    <text x="120" y="30" class="box-txt">1. Thu ngân tạo đơn hàng</text>
    <text x="120" y="50" class="box-sub">Chọn món, kích cỡ ly (Size), số lượng</text>
  </g>

  <line x1="290" y1="115" x2="350" y2="115" class="arrow"/>

  <!-- Step 2: Bấm thanh toán -->
  <g transform="translate(360, 80)">
    <rect width="250" height="70" rx="8" fill="#1E3A8A"/>
    <text x="125" y="30" class="box-txt">2. Bấm "Thanh toán"</text>
    <text x="125" y="50" class="box-sub">Gửi danh sách món &amp; size về máy chủ</text>
  </g>

  <line x1="610" y1="115" x2="680" y2="115" class="arrow"/>

  <!-- Step 3: Truy vấn định lượng -->
  <g transform="translate(690, 80)">
    <rect width="260" height="70" rx="8" fill="#4F46E5"/>
    <text x="130" y="30" class="box-txt">3. Đọc bảng DinhLuong</text>
    <text x="130" y="50" class="box-sub">Tính: Tổng NL = SL bán × Lượng cần 1 ly</text>
  </g>

  <path d="M 820 150 L 820 220 L 520 220" class="arrow"/>

  <!-- Step 4: Decision (Thoi ton kho du khong?) -->
  <g transform="translate(380, 240)">
    <polygon points="125 0, 250 55, 125 110, 0 55" fill="#EAB308"/>
    <text x="125" y="50" font-family="'Segoe UI', Arial" font-weight="bold" fill="#713F12" font-size="13px" text-anchor="middle">Kiểm tra tồn kho?</text>
    <text x="125" y="68" font-family="'Segoe UI', Arial" font-size="11px" fill="#713F12" text-anchor="middle">(SoLuongTon >= Can?)</text>
  </g>

  <!-- Branch NO: Không đủ kho -->
  <line x1="380" y1="295" x2="280" y2="295" class="arrow"/>
  <text x="320" y="285" font-family="'Segoe UI', Arial" font-weight="bold" fill="#DC2626" font-size="12px">KHÔNG ĐỦ</text>

  <g transform="translate(40, 260)">
    <rect width="230" height="75" rx="8" fill="#DC2626"/>
    <text x="115" y="30" class="box-txt">⛔ TRIGGER NÉM LỖI!</text>
    <text x="115" y="48" class="box-sub">RAISERROR(N'Nguyên liệu thiếu!')</text>
    <text x="115" y="65" class="box-sub">ROLLBACK TRANSACTION</text>
  </g>

  <!-- Branch YES: Đủ kho -->
  <line x1="505" y1="350" x2="505" y2="420" class="arrow"/>
  <text x="515" y="385" font-family="'Segoe UI', Arial" font-weight="bold" fill="#16A34A" font-size="12px">ĐỦ HÀNG</text>

  <!-- Step 5: Trừ tồn kho & Ghi log -->
  <g transform="translate(360, 420)">
    <rect width="290" height="75" rx="8" fill="#059669"/>
    <text x="145" y="30" class="box-txt">⚡ TRIGGER THỰC THI TRỪ KHO</text>
    <text x="145" y="50" class="box-sub">UPDATE NguyenLieu SET Ton = Ton - Can</text>
    <text x="145" y="67" class="box-sub">Ghi nhận log vào LichSuKho (Audit Trail)</text>
  </g>

  <line x1="650" y1="457" x2="720" y2="457" class="arrow"/>

  <!-- Step 6: In hóa đơn Crystal Report -->
  <g transform="translate(730, 420)">
    <rect width="220" height="75" rx="8" fill="#78350F"/>
    <text x="110" y="30" class="box-txt">🧾 IN CRYSTAL REPORT</text>
    <text x="110" y="50" class="box-sub">Xuất hóa đơn 80mm,</text>
    <text x="110" y="67" class="box-sub">VietQR và cập nhật doanh thu</text>
  </g>

</svg>